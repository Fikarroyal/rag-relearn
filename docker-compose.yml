services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: ragrelearn }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rag -d ragrelearn"], interval: 3s, retries: 20 }
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/ragrelearn
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8000:8000"]
  mcp-server:
    build: { context: ., dockerfile: docker/mcp.Dockerfile }
    environment: { BACKEND_URL: "http://backend:8000" }
    depends_on: [backend]
    ports: ["8765:8765"]
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["3000:80"]
volumes: { pgdata: {}, qdrant: {} }
